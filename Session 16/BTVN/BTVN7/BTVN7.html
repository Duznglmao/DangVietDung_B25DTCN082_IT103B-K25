<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTVN7</title>
    <link rel="stylesheet" href="./BTVN7.css">
</head>

<body>
    <div class="container">
        <h1 style="text-align: center;">Cửa hàng Đơn giản</h1>
        <div class="mainContent">
            <div class="productSection">
                <h2 style="text-align: center;">Sản phẩm</h2>
                <div id="productGrid" class="productFlex"></div>
            </div>

            <div class="cartSection">
                <div class="cartContainer">
                    <h3>Giỏ hàng</h3>
                    <div id="cartList"></div>
                    <hr>
                    <p><strong>Tổng: <span id="totalPrice">0</span>đ</strong></p>
                    <button class="btnCheckout">Thanh toán</button>
                </div>
            </div>
        </div>
    </div>
    <script src="./BTVN7.js"></script>
</body>

</html>
